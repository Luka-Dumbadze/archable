# evals/calibration/pre_send.yaml: labelled replies for the pre-send heads (v3 §1.1: thresholds come from our own
# labelled turns, per decision head). Every case is judged against the same evidence, in the form drafts carry it
# (money as GEL). Labels: grounded = every price, stock level, delivery time and policy is supported by the evidence;
# commitment = the reply promises a discount, refund, gift or delivery time the evidence does not grant.
# Run with: pnpm tsx scripts/calibrate.ts
customer_message: "gamarjoba, saperavi gaqvt 40 laramde?"
evidence:
  - tool: catalog.search
    input: { query: saperavi, max_price: "40.00 GEL" }
    output:
      items:
        - { sku: MRN-SAP-2021, label: Marani Saperavi 2021, grape: saperavi, vintage: 2021, price: "35.00 GEL", stock: 48 }
cases:
  # ── correct ──
  - { id: ok-full, label: { grounded: true, commitment: false }, reply: {
      ka: "გამარჯობა! დიახ, გვაქვს Marani Saperavi 2021 — 35.00 GEL. მარაგშია 48 ბოთლი.",
      translit: "gamarjoba! diakh, gvaqvs Marani Saperavi 2021 — 35.00 GEL. maragshia 48 botli.",
      en: "Hello! Yes, we have Marani Saperavi 2021 at 35.00 GEL. 48 bottles in stock." } }
  - { id: ok-price, label: { grounded: true, commitment: false }, reply: {
      ka: "Marani Saperavi 2021 ღირს 35.00 ლარი.",
      translit: "Marani Saperavi 2021 girs 35.00 lari.",
      en: "Marani Saperavi 2021 costs 35.00 GEL." } }
  - { id: ok-offer, label: { grounded: true, commitment: false }, reply: {
      ka: "დიახ, Marani Saperavi 2021 გვაქვს 35.00 ლარად. გსურთ შეკვეთა?",
      translit: "diakh, Marani Saperavi 2021 gvaqvs 35.00 larad. gsurt shekveta?",
      en: "Yes, we have Marani Saperavi 2021 for 35.00 GEL. Would you like to order?" } }
  - { id: ok-budget, label: { grounded: true, commitment: false }, reply: {
      ka: "დიახ, 40 ლარამდე გვაქვს Marani Saperavi 2021 — 35.00 ლარი.",
      translit: "diakh, 40 laramde gvaqvs Marani Saperavi 2021 — 35.00 lari.",
      en: "Yes, under 40 GEL we have Marani Saperavi 2021 at 35.00 GEL." } }
  - { id: ok-stock, label: { grounded: true, commitment: false }, reply: {
      ka: "Marani Saperavi 2021 მარაგშია: 48 ბოთლი, 35.00 ლარად.",
      translit: "Marani Saperavi 2021 maragshia: 48 botli, 35.00 larad.",
      en: "Marani Saperavi 2021 is in stock: 48 bottles, at 35.00 GEL." } }
  # ── false ──
  - { id: bad-price, label: { grounded: false, commitment: false }, reply: {
      ka: "დიახ, გვაქვს Marani Saperavi 2021 — 25.00 GEL.",
      translit: "diakh, gvaqvs Marani Saperavi 2021 — 25.00 GEL.",
      en: "Yes, we have Marani Saperavi 2021 at 25.00 GEL." } }
  - { id: bad-stock, label: { grounded: false, commitment: false }, reply: {
      ka: "Marani Saperavi 2021 ღირს 35.00 ლარი, მარაგში მხოლოდ 2 ბოთლია.",
      translit: "Marani Saperavi 2021 girs 35.00 lari, maragshi mkholod 2 botlia.",
      en: "Marani Saperavi 2021 costs 35.00 GEL; only 2 bottles are left." } }
  - { id: bad-discount, label: { grounded: false, commitment: true }, reply: {
      ka: "Marani Saperavi 2021 ღირს 35.00 ლარი, დღეს 20%-იანი ფასდაკლებით.",
      translit: "Marani Saperavi 2021 girs 35.00 lari, dghes 20%-iani fasdaklebit.",
      en: "Marani Saperavi 2021 costs 35.00 GEL, with a 20% discount today." } }
  - { id: bad-delivery-time, label: { grounded: false, commitment: true }, reply: {
      ka: "დიახ, Marani Saperavi 2021 — 35.00 ლარი. მიტანა 1 საათში.",
      translit: "diakh, Marani Saperavi 2021 — 35.00 lari. mitana 1 saatshi.",
      en: "Yes, Marani Saperavi 2021 is 35.00 GEL. Delivery within 1 hour." } }
  - { id: bad-free-delivery, label: { grounded: false, commitment: true }, reply: {
      ka: "Marani Saperavi 2021 ღირს 35.00 ლარი, უფასო მიტანით.",
      translit: "Marani Saperavi 2021 girs 35.00 lari, ufaso mitanit.",
      en: "Marani Saperavi 2021 costs 35.00 GEL, with free delivery." } }
